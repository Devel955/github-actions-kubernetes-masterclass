---
# Ansible Playbook - SkillPulse Server Setup
# Installs Docker, Git and deploys the app on EC2

- name: Setup SkillPulse Server
  hosts: skillpulse_servers
  become: true
  vars:
    app_dir: /home/ubuntu/skillpulse
    repo_url: https://github.com/Devel955/github-actions-kubernetes-masterclass.git

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose-plugin
          - git
          - curl
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Clone SkillPulse repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        force: yes

    - name: Copy .env file
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Start application with Docker Compose
      shell: |
        cd {{ app_dir }}
        docker compose pull
        docker compose up -d
      args:
        executable: /bin/bash

    - name: Verify app is running
      uri:
        url: http://localhost/health
        method: GET
        status_code: 200
      retries: 5
      delay: 10