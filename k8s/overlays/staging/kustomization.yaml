apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-staging

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: skillpulse-staging
    target:
      kind: Namespace

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment

labels:
  - pairs:
      environment: staging

images:
  - name: trainwithshubham/skillpulse-backend
    newTag: latest
  - name: trainwithshubham/skillpulse-frontend
    newTag: latest
