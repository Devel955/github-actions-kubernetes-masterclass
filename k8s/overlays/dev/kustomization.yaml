apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-dev

resources:
  - ../../00-namespace.yaml
  - ../../10-mysql.yaml
  - ../../20-backend.yaml
  - ../../30-frontend.yaml

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: skillpulse-dev
    target:
      kind: Namespace

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

commonLabels:
  environment: dev

images:
  - name: trainwithshubham/skillpulse-backend
    newTag: latest
  - name: trainwithshubham/skillpulse-frontend
    newTag: latest