apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-dev

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: skillpulse-dev
    target:
      kind: Namespace

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

labels:
  - pairs:
      environment: dev

images:
  - name: trainwithshubham/skillpulse-backend
    newTag: latest
  - name: trainwithshubham/skillpulse-frontend
    newTag: latest
